      every process instantiation (no database/file persistence). Every
      "current status" claim below is code-capability-confirmed only, not
      a verified production earning status — corrected per review
      (charliecreates, P1) from an earlier version that wrongly asserted
      specific streams were "live" or "zero balance" based on this
      zero-initialization, which is a property of any fresh instance
      regardless of real earnings.
  saas_tiers:
    status: verified_caveat
    path: src/monetisation/billing.py
    note: "Code capability confirmed; whether STRIPE_SECRET_KEY and real price IDs are actually set in production is not verifiable from source code (Stripe defaults to 'free-only mode' when unset)"
