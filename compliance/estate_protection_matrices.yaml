      free: {price_gbp: 0, req_per_hour: 100}
      pro: {price_gbp: 29, req_per_hour: 1000}
      business: {price_gbp: 149, req_per_hour: 10000, req_per_day: 100000}
      enterprise: {price_gbp: null, req_per_hour: -1, note: "per-negotiation, not a published tier"}
  revenue_streams:
    total_defined: 12
    status: verified_caveat
    note: "All 12 streams carry the same status: code capability confirmed, live-earning status not independently verifiable given no_persistence_caveat above"
    streams:
