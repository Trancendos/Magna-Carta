encryption:
  mc_id: MC-014
  human_readable: docs/compliance/ENCRYPTION-MATRIX.md
  audit_date: "2026-07-24"
  reaudit_date: "2026-07-25"
  in_transit:
    traefik_websecure_entrypoint:
      status: verified_clear
      note: "FIXED 2026-07-25: --certificatesresolvers.letsencrypt.acme.email/.storage/.httpchallenge* flags added to the Traefik service's command: block in docker-compose.production.yml; the letsencrypt certresolver referenced by service labels is now actually defined"
    p0_services_on_plain_http:
      status: verified_clear
      services: ["infinity-auth", "infinity-void", "tranc3-backend", "tranc3-ai", "api-gateway", "infinity-ws"]
      note: "FIXED 2026-07-25: all six now route on entrypoints=websecure with tls=true and tls.certresolver=letsencrypt, plus a Host(`api.trancendos.com`) matcher so ACME has a real domain to issue against (previously PathPrefix-only, which Traefik's ACME cannot resolve a cert for)"
    p3_workers_missing_tls_label:
      status: verified_clear
      services: ["fabulousa-service", "ice-box-service"]
      note: "FIXED 2026-07-25: both now carry tls=true and tls.certresolver=letsencrypt alongside entrypoints=websecure in docker-compose.production.yml"
    additional_websecure_workers_missing_tls_label:
      status: verified_clear
      count: 37
      note: "FOUND AND FIXED 2026-07-25: writing scripts/compliance_drift_audit.py's websecure_tls_labels check and running it against the full compose file surfaced 37 more services (beyond the 6 P0 + fabulousa/ice-box already known) referencing entrypoints=websecure with no tls/certresolver label at all. All 37 now carry tls=true + tls.certresolver=letsencrypt."
    tls_routers_host_matcher:
      status: verified_clear
      count: 39
      note: "FOUND AND FIXED 2026-07-25 (same day as the label fix above): all 39 routers with tls=true but only a PathPrefix rule (the 37 above, plus fabulousa-service and ice-box-service) now carry Host(`<worker>.trancendos.com`) — subdomain-per-worker, the domain strategy decided for this fix. scripts/compliance_drift_audit.py's new tls_routers_have_host_matcher check guards against regression. Does not itself guarantee the 39 subdomains' DNS records exist — that provisioning step is a separate infra/ops task, not claimed as done here."
    redis_tls:
      status: verified_clear
      note: "REDIS_URL uses rediss:// per .env.example"
    postgres_tls:
      status: verified_clear
      note: "FIXED 2026-07-25: DATABASE_URL example in .env.example now includes ?sslmode=require; SQLAlchemy's create_engine() passes the DSN straight to psycopg2, which honors sslmode natively — no code change needed beyond the connection-string default"
  at_rest:
    the_void_vault:
      status: verified_clear
      note: "AES-GCM + PBKDF2 (100k, SHA-256), 256-bit key, random IV — both CF Worker and self-hosted Python port"
    vault_service:
      status: verified_clear
      note: "AES-256-GCM + PBKDF2 (100k, SHA-256); replaced a prior insecure XOR cipher per its own code comments"
    sqlite_field_encryption:
      status: verified_caveat
      note: "src/database/encrypted_sqlite.py provides a real opt-in AES-GCM field-encryption helper; adoption in the main Postgres schema not confirmed"
  secrets_and_signing:
    jwt_algorithm:
      status: verified_clear
      value: "HS256"
    jwt_secret_default_handling:
      status: verified_clear
      note: "Fails fast or generates an ephemeral secrets.token_hex(32); no hardcoded insecure default found"
    password_hashing:
      status: verified_clear
      note: "FIXED 2026-07-25: src/auth/db_user_manager.py's _BcryptContext retired in favor of _PasswordContext, which hashes new passwords via src/auth/passwords.py's hash_password() (argon2id preferred). Pre-existing bcrypt hashes still verify and upgrade to the new scheme on next successful login (DB-backed and in-memory-fallback paths both covered). Guarded by scripts/compliance_drift_audit.py's db_user_manager_consolidated_hashing check."
    internal_secret_dev_fallback:
      status: verified_clear
      affected_workers:
        - basement
        - chaos-party
        - imaginarium
        - imind
        - resonate
        - sashas-photo-studio
        - taimra
        - tateking
        - the-academy
        - the-dutchy
        - the-lab
        - the-studio
        - the-void
        - tranceflow
        - tranquility
        - vrar3d
        - warp-radio
        - warp-tunnel
      count: 18
      note: "FIXED 2026-07-25: all 18 workers now raise RuntimeError at startup if INTERNAL_SECRET is unset or equals 'dev-secret' (stripped comparison, closing a whitespace-padding bypass a bot reviewer found in the first fix pass), matching the infinity-void reference pattern. Also extended to workers/tateking/main.py, workers/the-lab/main.py, workers/imaginarium/main.py (the real deployed entrypoints for those three, distinct from their worker.py) and workers/tranceflow/config.py, workers/vrar3d/config.py. The validated secret is now also stored stripped, not raw, so incidental whitespace from secret injection (k8s/file-mounted secrets) can't silently break auth even after passing validation."
    internal_secret_safe_pattern_reference:
      status: verified_clear
      worker: infinity-void
      note: "Explicitly rejects both an unset value and the string 'internal-dev-secret', raising RuntimeError at startup — proof the safe pattern already exists in-repo"
  action_items: []

security:
  mc_id: MC-015
  human_readable: docs/compliance/SECURITY-MATRIX.md
  audit_date: "2026-07-24"
  reaudit_date: "2026-07-25"
  auth_coverage:
    partial_auth_shared_secret:
      status: verified_clear
      services: ["the-studio", "imind", "tranquility", "taimra", "vrar3d", "resonate", "sashas-photo-studio"]
      note: "FIXED 2026-07-25: all 7 are among the 18 workers whose dev-secret fallback was removed (see encryption.secrets_and_signing.internal_secret_dev_fallback) — X-Internal-Secret is now a real, required, unguessable secret, not a weak shared default"
    no_auth_standalone_workers:
      status: verified_clear
      findings:
        - worker: fabulousa-service
          previously_unauthenticated_routes: ["GET /fabulousa/status", "GET /fabulousa/projects", "GET /fabulousa/assets"]
          note: "FIXED: GET /fabulousa/projects and GET /fabulousa/assets now gated behind _require_internal_auth; GET /fabulousa/status remains intentionally public (health-style status endpoint), matching the same open-by-design convention as /health elsewhere"
        - worker: ice-box-service
          previously_unauthenticated_routes: ["GET /quarantine", "GET /quarantine/{id}", "GET /stats"]
          note: "FIXED: GET /quarantine and GET /quarantine/{id} now gated behind _require_internal_auth; GET /stats intentionally left public as a health/metrics-style endpoint"
    no_auth_inrepo_routers:
      status: verified_clear
      routers:
        - src/imind/routes.py
        - src/vrar3d/routes.py
        - src/resonate/routes.py
        - src/artifactory/routes.py
        - src/library/routes.py
        - src/studio/routes.py
      note: "FIXED 2026-07-25: all six now require Depends(get_current_user) on every non-status route; artifactory and library's delete endpoints require the same auth plus (library) an ownership/classification check before deleting a RESTRICTED article; resonate and vrar3d additionally enforce self-or-admin ownership on user-scoped actions. tests/test_shared_resource_routers_auth.py (43 tests) covers public-status-stays-public, unauthenticated-rejected, authenticated-allowed, and ownership-denied/admin-override cases for all six."
    verified_auth_present:
      status: verified_clear
      routers:
        - src/tranquility/routes.py
        - src/taimra/routes.py
        - workers/library-service/router.py
        - workers/files-service/worker.py
      note: "Corrects earlier per-entity doc-pack assumptions that tranquility/taimra had no auth"
  cors:
    main_monolith:
      status: verified_clear
      note: "api.py uses CORS_ORIGINS env var, defaults to localhost only, not wildcard"
    standalone_workers:
      status: verified_clear
      count: 68
      note: "FIXED 2026-07-25 (commit 3e428d35): all 68 flagged worker/main.py files now parse CORS_ORIGINS as a trimmed, empty-filtered allowlist instead of allow_origins=['*'] — [o.strip() for o in os.getenv('CORS_ORIGINS', 'http://localhost:3000').split(',') if o.strip()]. The generator template (workers/_generate_workers.py) had the same wildcard as its own default (os.environ.get('CORS_ORIGINS', '*')) and was fixed separately (commit a7ae3e00) so regenerating a worker doesn't reintroduce it, plus a follow-up fix (commit 0870bc71) for a missing `import os` that would have made the generated template crash with NameError. The credentialed dimensional-nexus-service worker now explicitly rejects a wildcard CORS_ORIGINS value at startup rather than letting Starlette crash on it. Verified 2026-07-25 via `grep -rl 'allow_origins=\\[\"\\*\"\\]' workers/` returning zero matches, and scripts/compliance_drift_audit.py's no_wildcard_cors check (PASS)."
  action_items:
    - "Schedule a full auth-coverage sweep of the remaining ~78 standalone workers not yet individually audited"
    - "Decide whether GET /fabulousa/status, GET /ice-box stats, and other open-by-design health-style endpoints should stay open or move behind auth too (owner decision, not a code defect)"

