      - api_metering
      - personality_packs
      - white_label_licenses
      - affiliate_commissions
      - github_sponsors
      - kofi_tips
      - marketplace_fees
      - data_insights
      - certification_fees
      - ad_revenue
      - consulting
    mentioned_but_not_implemented:
