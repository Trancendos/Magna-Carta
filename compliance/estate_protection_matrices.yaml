      # NOT a key in RevenueTracker.STREAMS (verified: only 12 keys exist,
      # matching total_defined above) — this appears only in the class's
      # own docstring as a "future" idea, never actually implemented.
  action_items:
    - "Wire RevenueTracker to a persistent store so status claims become independently verifiable"
    - "Confirm STRIPE_SECRET_KEY is genuinely set in the production deployment environment"

