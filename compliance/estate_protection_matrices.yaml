---
# Estate Protection Matrices — machine-readable register
# Covers: License Compliance (MC-012), Intellectual Property (MC-013),
# Encryption (MC-014), Security (MC-015), Legal (MC-016), Financial
# (MC-017), Knowledge (MC-018), Revenue (MC-019), Taxation (MC-020),
# Zero-Cost (MC-021)
# Generated: 2026-07-24
# Human-readable siblings: docs/compliance/{LICENSE-COMPLIANCE,INTELLECTUAL-PROPERTY,ENCRYPTION,SECURITY,LEGAL,FINANCIAL,KNOWLEDGE,REVENUE,TAXATION,ZERO-COST}-MATRIX.md
# Parent register: compliance/magna_carta_register.yaml
# Bridge: compliance/tranc3_register_bridge.yaml

meta:
  register_version: "1.0.0"
  owner: "Platform Engineering / ISMS Lead"
  last_updated: "2026-07-24"
  review_cycle: "quarterly"
  next_review: "2026-10-24"
  magna_carta_register: "compliance/magna_carta_register.yaml"
  status_legend:
    verified_clear: "✅ — Verified, no known conflict/gap"
    verified_caveat: "⚠️ — Verified with a documented caveat"
    not_assessed: "📋 — Not yet assessed"
    confirmed_gap: "❌ — Confirmed conflict or gap, remediation required"
    external_action: "🎯 — Requires an external/owner action this framework cannot self-certify"
  honesty_note: >
    Per REGULATION-MATRIX.md §6: do not claim compliance/clearance in product
    copy unless the corresponding row is verified_clear with evidence.

license_compliance:
  mc_id: MC-012
  human_readable: docs/compliance/LICENSE-COMPLIANCE-MATRIX.md
  scan_date: "2026-07-24"
  scan_tool: "pip-licenses --format=json --with-urls"
  packages_scanned: 190
  license_family_summary:
    permissive:
      count: 158
      families: ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "PSF-2.0", "Unlicense"]
      status: verified_clear
    weak_copyleft:
      count: 11
      families: ["LGPL", "LGPLv2+", "MPL-2.0"]
      status: verified_caveat
      note: "Safe as unmodified library dependencies; would become a gap only if this estate modified and redistributed the library itself"
    strong_copyleft:
      count: 1
      families: ["GPL (python-apt)"]
      status: not_assessed
      note: "Ubuntu system package pulled in transitively by the sandbox/OS image, not a Tranc3-authored or redistributed dependency — confirm absent from shipped container images"
    proprietary:
      count: 16
      families: ["NVIDIA CUDA/cuDNN/NCCL runtime bindings"]
      status: verified_clear
      note: "Transitive torch GPU dependencies redistributed under NVIDIA's standard runtime-library terms"
    unknown:
      count: 4
      packages: ["cuda-toolkit", "pygad", "rustworkx", "sentencepiece"]
      status: not_assessed
      note: "pip-licenses could not resolve SPDX metadata; sentencepiece is confirmed MIT per its upstream LICENSE file, the other 3 need the same manual check"
  action_items:
    - "Confirm GPL/LGPL Ubuntu-tooling rows are sandbox-only, absent from shipped container images"
    - "Manually resolve the 4 unknown-license rows against each package's actual LICENSE file"
    - "Wire pip-licenses into Tranc3's .forgejo/workflows/dependency-audit.yml"

intellectual_property:
  mc_id: MC-013
  human_readable: docs/compliance/INTELLECTUAL-PROPERTY-MATRIX.md
  estate_protection:
    code_ownership: verified_clear
    entity_name_trademark_clearance:
      status: external_action
