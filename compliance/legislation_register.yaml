  - legislation_id: LEG-011
    name: "Regulation (EU) 2024/2847 (Cyber Resilience Act)"
    short_name: "EU CRA"
    jurisdiction: EU
    status: Programme
    celex: "32024R2847"
    eli_uri: "https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng"
    consolidated_text_uri: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02024R2847-20241120"
    oj_reference: "OJ L, 2024/2847, 20.11.2024"
    compliance_owner: "Platform Owner Trancendos / DPO"
    profile: "docs/compliance/EU-CRA-PROFILE.md"
    # Article 71(2) staggers application. Recorded per-provision rather than as a
    # single "applies from" date, because two of the three have already arrived.
    key_dates:
      entered_into_force: "2024-12-10"
      chapter_iv_applies: "2026-06-11"        # Arts 35-51, notification of conformity assessment bodies — ALREADY IN FORCE
      reporting_obligations_apply: "2026-09-11"  # Art 14
      fully_applicable: "2027-12-11"
    review_cycle: quarterly
    last_reviewed: "2026-09-14"
    review_date: "2026-11-09"
    notes: >-
      Active rather than watch-list: obligations attach to a product with digital
      elements placed on the EU market, and the owner has confirmed EU users are in
      scope. Two determinations govern applicability -- whether the free/open-source
      carve-out applies, and whether anything has yet been placed on the market.
      Both are made once, with their supporting evidence, in EU-CRA-PROFILE.md
      section 3, and are deliberately NOT restated here: that evidence cites specific
      implementation paths in the Tranc3 repository, and duplicating it would let the
      two copies diverge silently when those paths change. Net effect: CRA readiness
      is a go-live gate item rather than a retrofit.
      OPEN ACTIONS carried by the profile, not settled here: legal confirmation of the
      commercial-activity determination, and a positive check of every supply channel
      before "nothing has been placed on the market" is relied upon.

  - legislation_id: LEG-012
    name: "Data (Use and Access) Act 2025"
    short_name: "DUAA"
    jurisdiction: UK
    status: Programme
    uk_legislation_uri: "https://www.legislation.gov.uk/ukpga/2025/18/contents"
    compliance_owner: DPO
    # Added by REV-2026-09-14. The DUAA received Royal Assent on 2025-06-19 and
    # AMENDS the three instruments this register already tracks -- UK GDPR
    # (LEG-001), DPA 2018 (LEG-002) and PECR (LEG-005) -- yet appeared nowhere in
    # the estate. The register was last reviewed 2026-06-09, four months after
    # the bulk of its data protection provisions commenced, and did not catch it.
    # That is the finding the lapsed review date was standing in front of.
    amends: ["LEG-001", "LEG-002", "LEG-005"]
    key_dates:
      royal_assent: "2025-06-19"
      commencement_no_1: "2025-08-20"          # Part 1 Smart Data; s.111 PECR breach notification
      commencement_no_6: "2026-02-05"          # bulk of Part 5 data protection amendments
      all_dp_provisions_commenced: "2026-06-19"  # ICO confirmation
    obligations: ["OBL-001", "OBL-002", "OBL-003", "OBL-004", "OBL-005", "OBL-006", "OBL-007", "OBL-008"]
    review_cycle: quarterly
    last_reviewed: "2026-09-14"
    review_date: "2026-10-26"
    notes: >-
      OPEN OBLIGATION, NOT YET EVIDENCED. s.103 inserts s.164A DPA 2018, a
      statutory complaints-handling duty: a controller must have a compliant
      complaints process. The ICO's stated deadline was June 2026, which has
      passed. Nothing in this repository currently evidences that process, so
      this is recorded as an open gap for the owner rather than marked compliant.
      Raised as ACT-020.

