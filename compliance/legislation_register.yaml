schema:
  legislation_id: "LEG-### unique identifier"
  jurisdiction: "UK | EU | US | Multi"
  status: "Compliant | Programme | Watch | N/A"
  celex: "EU CELEX number (EU acts only)"
  eli_uri: "European Legislation Identifier URI (EU acts only)"
  oj_reference: "Official Journal citation"
  consolidated_text_uri: "EUR-Lex consolidated text (if applicable)"
  uk_legislation_uri: "legislation.gov.uk URI (UK acts only)"
  review_cycle: "quarterly | semiannual | annual — how fast this instrument
    actually moves. Set per item, not per register: the EU AI Act and the FCA
    Handbook do not change at the same rate as the Computer Misuse Act 1990."
  last_reviewed: "YYYY-MM-DD — when a reviewer last checked this instrument
    against its authoritative source. Distinct from review_date, which is when
    the NEXT review falls due. Without both, a register cannot show whether a
    date was met or merely moved."
  review_date: "YYYY-MM-DD — next review due. MON-011 errors once it passes and
    warns for 30 days before. Dates must be staggered: max_shared_review_date
    caps how many items may fall due on one day."

