  - legislation_id: LEG-006
    name: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    short_name: "EU AI Act"
    jurisdiction: EU
    status: Programme
    celex: "32024R1689"
    eli_uri: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
    oj_reference: "OJ L, 12.7.2024 (Regulation (EU) 2024/1689)"
    consolidated_text_uri: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689"
    compliance_owner: "AI Lead"
    obligations: ["OBL-020", "OBL-021", "OBL-022", "OBL-023", "OBL-024"]
    article_anchors:
      art_5: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689#art_5"
      art_9: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689#art_9"
      art_13: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689#art_13"
      art_14: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689#art_14"
      art_15: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689#art_15"
      art_50: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689#art_50"
    review_cycle: quarterly
    last_reviewed: "2026-09-14"
    review_date: "2026-11-02"
    key_dates:
      # REV-2026-09-14: the Digital Omnibus on AI was published in the OJ on
      # 2026-07-24 and entered into force 2026-07-27 -- six days before the
      # original high-risk deadline, and seven weeks AFTER this register was
      # last reviewed. SCAN-2026-Q2-01 explicitly said "High-risk deadline
      # 2 Aug 2026 -- track Digital Omnibus proposals", so the June review
      # opened this loop and the lapsed date is what stopped it closing.
      art_50_transparency_applies: "2026-08-02"   # UNCHANGED by the Omnibus — live now
      art_50_watermarking_grace_ends: "2026-12-02"  # deployed systems only
      annex_iii_high_risk_applies: "2027-12-02"   # deferred from 2026-08-02
      annex_i_embedded_applies: "2028-08-02"      # deferred from 2027-08-02
    notes: >-
      Delegated and implementing acts tracked in secondary_legislation_watch.
      REV-2026-09-14: the deferral is NOT a reprieve for this platform. Article 50
      transparency took effect 2026-08-02 on its original schedule and is live
      today; only the Annex III high-risk regime moved. A register that recorded
      "high-risk deadline 2 Aug 2026" and nothing else would have read as though
      everything had slipped.

