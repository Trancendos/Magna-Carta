  - id: MC-042
    standard: "EU CRA / Art. 13 + Annex I, Part II, point 1"
    title: "SBOM covering at least top-level dependencies, current for the support period"
    description: "Annex I, Part II, point (1) requires the manufacturer to identify and document vulnerabilities and components, 'including by drawing up a software bill of materials in a commonly used and machine-readable format covering at the very least the top-level dependencies of the products', kept current through the support period and producible to market surveillance authorities on request."
    status: PROGRAMME_ARTEFACT
    evidence:
      - type: workflow
        path: .forgejo/workflows/security-scan.yml
        description: "sbom-generation job — syft CycloneDX + SPDX, grype match, conditional Dependency-Track upload"
    verification_method: artefact_review
    last_reviewed: "2026-08-19"
    reviewer: "Platform Owner Trancendos"
    notes: "PARTIAL. Generation is real and dual-format. The gap is retention: SBOMs are CI artefacts on a retention window, not durable version-keyed records for released versions. This ENABLES MC-045 rather than gating it: the Article 14 clocks run from awareness, so a missing SBOM makes the 24-hour answer harder to produce but does not postpone the deadline. Both are independent go-live gates."

