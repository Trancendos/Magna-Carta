    notes: "110 direct dependencies measured, 0 errored: 95 healthy, 10 lagging, 5 stranded, 0 zombie. The weekly scheduled run catches a component crossing the dormancy threshold with no commit involved, which is how obsolescence actually arrives. SCOPE LIMIT: the census covers DIRECT dependencies only. That is sufficient for the Annex I SBOM minimum under MC-042 (the CRA asks for 'top-level dependencies'), and it is NOT the full extent of Art. 13(5), whose due-diligence duty reaches integrated components generally — and OSSRA measures 64% of components in a typical codebase as transitive. Recorded as a known scope boundary rather than left to look like full coverage; transitive maintenance-trajectory evidence is outstanding work."

  - id: MC-045
    standard: "EU CRA / Art. 14"
    title: "Article 14 reporting — two paths, two final-report clocks"
    description: >-
      From 11 September 2026, via the Article 16 single reporting platform, submitted
      simultaneously to the coordinating CSIRT and ENISA.
      (a) ACTIVELY EXPLOITED VULNERABILITY: early warning within 24 hours of becoming
      aware; vulnerability notification within 72 hours; final report no later than
      14 days after a corrective or mitigating measure is available.
      (b) SEVERE INCIDENT affecting the security of the product: early warning within
      24 hours; incident notification within 72 hours; final report no later than ONE
      MONTH AFTER THE SUBMISSION of that incident notification -- the clock runs from
      when the notification is actually submitted, not from the expiry of the 72-hour
      window, so submitting early shortens the final-report deadline too.
      The two paths share a trigger discipline and differ in the final-report clock,
      so a single combined procedure would get one of them wrong."
    status: GAP
    evidence: []
    verification_method: procedure_exercise
    last_reviewed: "2026-08-19"
    reviewer: "Platform Owner Trancendos"
    notes: >-
      THE BINDING GAP, and the one with the nearest deadline. Nothing exists: the
      applicable notification endpoint has not been determined, no notification path
      has been exercised, no clock runs, no role is named.

      ENDPOINT, NOT DESIGNATION. A manufacturer does not designate a CSIRT. Under
      Art. 14(7) the notification goes to the electronic notification end-point of the
      CSIRT designated as coordinator by the Member State of the manufacturer's MAIN
      ESTABLISHMENT -- the place where decisions about the cybersecurity of its
      products are predominantly taken -- submitted through the Art. 16 single
      reporting platform, with ENISA able to access it simultaneously. So the open
      work is: establish which Member State that is, resolve its coordinating CSIRT's
      endpoint, and test the route. An earlier draft said "no designated CSIRT", which
      described a task nobody at Trancendos can perform.

      TRIGGER: the standard is "actively exploited". An earlier draft of this entry
      glossed that as "proof-of-concept code exists", which is not the test and
      would have set the clock running on the wrong event.

      NOT CONDITIONAL ON MC-042. Article 14 deadlines run from awareness regardless
      of what inventory exists, so durable SBOM retention is an enabler, not a
      precondition, and treating it as one would be a way of explaining why the
      deadline was missed. Both are independent go-live gates. Until per-release
      SBOM retention lands, an interim answer to "which shipped versions contain
      component X?" must exist and be exercised at least once against a real
      advisory -- an untested reporting path is not a reporting path.

      24 hours is a lookup interval, not a scanning interval: it is unmeetable by a
      process that begins with running a scan. Every component has an existing home
      (Artifactory for the per-release SBOM store, Cryptex for advisory intake, the
      escalation FSM for the clock, the Observatory for the immutable record, /roles
      for a CRA Reporting Officer, CranBania for the SLA card). Those homes are
      candidate mappings, not verified contracts -- each needs confirming against
      what the service actually does before the work is scheduled as integration.

