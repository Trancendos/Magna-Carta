    notes: "No support period is declared anywhere in the estate. This is a business commitment rather than a compliance artefact -- it is the owner's decision how long Trancendos will maintain what it ships -- but it must be made before first placement, because it is published to users and cannot easily be shortened afterwards."

  - id: MC-047
    standard: "EU CRA / Art. 13(9) + Art. 13(13)"
    title: "Retention: technical documentation, and security-update availability"
    description: >-
      Two distinct obligations with the same shape of clock, both "whichever is
      longer" rather than a flat ten years.
      Art. 13(13): keep the technical documentation and the EU declaration of
      conformity at the disposal of market surveillance authorities for at least
      10 years after the product is placed on the market, OR for the support
      period, whichever is longer.
      Art. 13(9): each security update remains available after it is issued for a
      minimum of 10 years, OR for the remainder of the support period, whichever
      is longer.
    status: GAP
    evidence: []
    verification_method: document_review
    last_reviewed: "2026-08-19"
    reviewer: "Platform Owner Trancendos"
    notes: >-
      CORRECTED 2026-08-19. This entry previously cited Art. 13(12) + Art. 31 and
      described the duty as "10 years AFTER the end of the support period". Both
      were wrong: the articles are 13(13) and 13(9), and the clock is 10 years OR
      the support period, whichever is longer -- which is a materially shorter and
      differently-anchored obligation than the one first recorded. A compliance
      register that overstates a duty is not conservatively safe; it plans the
      wrong retention and misstates the position to an authority.

      Governance documentation is version-controlled, which is a reasonable
      foundation, but no retention policy targets either duration. The Observatory
      already carries retention_class and legal_hold fields, so this needs two CRA
      retention classes defined and applied -- one per clock -- rather than new
      machinery.
