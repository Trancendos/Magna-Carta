# Matrix Suites — machine-readable registry
#
# Bundles the estate's 31 governance/compliance matrices (13 in this repo,
# 18 in Tranc3 docs/governance/) into 8 Suites, each governed by one of the
# platform's 8 Pillars (src/entities/platform.py Pillar enum) and stewarded
# by the Lead AI of the Location whose function matches the suite.
#
# Human-readable sibling: docs/governance/MATRIX-SUITES.md
# Validated by: scripts/matrix_suites_check.py (Layer B CI)
#
# Invariants the validator enforces:
#   * every matrix in the estate inventory is assigned to exactly one suite
#   * every suite names a pillar, steward AI, steward location, presiding prime
#   * every suite has a review cadence and a next_review date
#
# Steward assignments are DEFAULTS. At runtime the authoritative holder of a
# stewardship is resolved through Tranc3's Role Assignment Registry (/roles),
# so operators can reassign an AI without editing this file; this file records
# the designed baseline the registry is seeded from.

meta:
  register_version: "1.0.0"
  owner: "Platform Owner Trancendos / ISMS Lead"
  created: "2026-07-31"
  last_updated: "2026-07-31"
  review_cadence_default: quarterly
  observatory_event_prefix: "governance.suite"
  townhall_integration: "CranBania board — one lane per suite (planned; see MATRIX-SUITES.md §6)"

