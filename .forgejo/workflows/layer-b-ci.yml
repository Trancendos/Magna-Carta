---
# Magna Carta — Layer B compliance CI
#
# Runs the compliance registers' own check scripts on every change. These scripts
# already existed and passed; nothing invoked them automatically, so a change that
# broke a register stayed invisible until someone ran them by hand.
#
# Forgejo (The Workshop) is the platform's primary CI per the zero-cost self-hosted
# policy. A mirrored GitHub Actions copy lives at .github/workflows/layer-b-ci.yml so
# these checks still run while The Workshop is offline during the cloud-only phase —
# same dual-path rationale as Tranc3's deploy-cloudflare.yml. Keep the two in sync.

name: layer-b-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer-b:
    name: "Layer B compliance checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # The two copies must stay identical apart from their header comments. A comment
      # saying so cannot enforce it; this can. Strips comments and blank lines from both
      # and fails on any difference in the executable content.
      - name: Verify the Forgejo and GitHub copies have not drifted
        shell: bash
        run: |
          diff -u \
            <(sed -E '/^[[:space:]]*(#|$)/d' .forgejo/workflows/layer-b-ci.yml) \
            <(sed -E '/^[[:space:]]*(#|$)/d' .github/workflows/layer-b-ci.yml) \
            && echo "Workflow copies are in sync."

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # Interpreter-qualified: run_layer_b_local_ci.sh invokes every check with
          # `python3`, so installing with a bare `pip` risks a different environment on
          # any runner where the two do not resolve to the same interpreter.
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 --version && python3 -m pip --version

      # run_layer_b_local_ci.sh is the single entry point the programme already uses
      # locally and via the weekly cron. CI runs exactly the same script so the two
      # cannot drift: compliance health, automation readiness, DPA readiness,
      # SEC-002 security testing and the zero-cost tooling register.
      - name: Layer B local CI
        run: bash scripts/run_layer_b_local_ci.sh
